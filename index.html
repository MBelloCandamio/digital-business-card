<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Digital business card of Martin Bello, Marine Biologist and Data Analist specializing in fisheries, aquaculture and seafood supply chains."
    >

    <meta name="theme-color" content="#ffffff">

    <title>Alex Morgan | Marine Biologist</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <main class="card">

        <!-- Profile -->
        <header class="profile">

            <img
                class="profile__photo"
                src="assets/images/profile.png"
                alt="Alex Morgan"
            >

            <div class="profile__identity">
                <h1 class="profile__name">
                    Martin Bello
                </h1>

                <p class="profile__title">
                    Marine Biologist & Data Analist
                </p>

                <p class="profile__specialties">
                    Fisheries · Aquaculture · Seafood Supply Chain
                </p>

                <p class="profile__company">
                    Sustainable Fisheries Partnership
                </p>
            </div>

        </header>


        <!-- Primary action -->
        <section class="primary-action">

            <a
                class="button button--primary"
                href="contact/contact.vcf"
                download
            >
                Add to contact
            </a>

        </section>

        <!-- Share card -->
        <section class="share-action">

            <button
                class="button button--secondary"
                id="share-card"
                type="button"
            >
                Share my card
            </button>

            <p
                class="share-feedback"
                id="share-feedback"
                aria-live="polite"
            ></p>

        </section>


        <!-- Contact options -->
        <nav class="contact-actions" aria-label="Contact options">

            <a
                class="contact-actions__link"
                href="https://www.linkedin.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                LinkedIn
            </a>

            <a
                class="contact-actions__link"
                href="mailto:martin.bello@sustainablefish.org"
            >
                Email
            </a>

            <a
                class="contact-actions__link"
                href="https://sustainablefish.org"
                target="_blank"
                rel="noopener noreferrer"
            >
                Website
            </a>

        </nav>


        <!-- Additional professional information -->
        <section class="professional-links">

            <a
                class="professional-links__link"
                href="https://https://sustainablefish.org/"
                target="_blank"
                rel="noopener noreferrer"
            >
                ORCID
            </a>

        </section>


        <!-- Footer -->
        <footer class="card__footer">

            <p>
                Let's stay connected.
            </p>

        </footer>

    </main>


    <!-- JavaScript -->
    <script src="js/app.js"></script>

</body>
</html>
