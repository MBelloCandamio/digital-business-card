<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Digital business card of Alex Morgan, Marine Biologist specializing in fisheries, aquaculture and seafood supply chains."
    >

    <meta name="theme-color" content="#ffffff">

    <title>Alex Morgan | Marine Biologist</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <main class="card">

        <!-- Profile -->
        <header class="profile">

            <img
                class="profile__photo"
                src="assets/images/profile.jpg"
                alt="Alex Morgan"
            >

            <div class="profile__identity">
                <h1 class="profile__name">
                    Alex Morgan
                </h1>

                <p class="profile__title">
                    Marine Biologist
                </p>

                <p class="profile__specialties">
                    Fisheries · Aquaculture · Seafood Supply Chain
                </p>

                <p class="profile__company">
                    Ocean Research Solutions
                </p>
            </div>

        </header>


        <!-- Primary action -->
        <section class="primary-action">

            <a
                class="button button--primary"
                href="contact/contact.vcf"
                download
            >
                Add to contact
            </a>

        </section>


        <!-- Contact options -->
        <nav class="contact-actions" aria-label="Contact options">

            <a
                class="contact-actions__link"
                href="https://www.linkedin.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                LinkedIn
            </a>

            <a
                class="contact-actions__link"
                href="mailto:alex.morgan@example.com"
            >
                Email
            </a>

            <a
                class="contact-actions__link"
                href="https://example.com"
                target="_blank"
                rel="noopener noreferrer"
            >
                Website
            </a>

        </nav>


        <!-- Additional professional information -->
        <section class="professional-links">

            <a
                class="professional-links__link"
                href="https://orcid.org/"
                target="_blank"
                rel="noopener noreferrer"
            >
                ORCID
            </a>

        </section>


        <!-- Footer -->
        <footer class="card__footer">

            <p>
                Let's stay connected.
            </p>

        </footer>

    </main>


    <!-- JavaScript -->
    <script src="js/app.js"></script>

</body>
</html>
