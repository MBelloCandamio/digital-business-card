<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Digital business card of Martin Bello, Marine Biologist and Data Analist specializing in fisheries, aquaculture and seafood supply chains."
    >

    <meta name="theme-color" content="#ffffff">

    <title>Martin Bello | Marine Biologist & Data Analist</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <main class="card">

        <!-- Profile -->
        <header class="profile">

            <img
                class="profile__photo"
                src="assets/images/profile.png"
                alt="Martin Bello"
            >

            <div class="profile__identity">
                <h1 class="profile__name">
                    Martin Bello
                </h1>

                <p class="profile__title">
                    Marine Biologist & Data Analist
                </p>

                <p class="profile__specialties">
                    Fisheries · Aquaculture · Seafood Supply Chain
                </p>

                <div class="profile__company">
                    <img
                        class="profile__company-logo"
                        src="assets\logo\susfish-logo.png"
                        alt="Sustainable Fisheries Partnership"
                    >
                </div>
            </div>

        </header>


        <!-- Primary action -->
        <section class="primary-action">

            <a
                class="button button--primary"
                href="contact/contact.vcf"
                download
            >
                Add to contact
            </a>

        </section>

        <!-- Share card -->
        <section class="share-action">

            <button
                class="button button--secondary"
                id="share-card"
                type="button"
            >
                Share my card
            </button>

            <p
                class="share-feedback"
                id="share-feedback"
                aria-live="polite"
            ></p>

        </section>

        <!-- QR action -->
        <section class="qr-action">
            <button
                class="qr-action__button"
                id="show-qr"
                type="button"
            >
                Show QR
            </button>
        </section>


        <!-- Contact options -->
        <nav class="contact-actions" aria-label="Contact options">

            <a
                class="contact-actions__link"
                href="https://www.linkedin.com/in/martin-bello-32996211b/"
                target="_blank"
                rel="noopener noreferrer"
            >
                LinkedIn
            </a>

            <a
                class="contact-actions__link"
                href="mailto:martin.bello@sustainablefish.org"
            >
                Email
            </a>

            <a
                class="contact-actions__link"
                href="https://sustainablefish.org"
                target="_blank"
                rel="noopener noreferrer"
            >
                Website
            </a>

        </nav>


        <!-- Additional professional information -->
        <section class="professional-links">

            <a
                class="professional-links__link"
                href="https://https://sustainablefish.org/"
                target="_blank"
                rel="noopener noreferrer"
            >
                ORCID
            </a>

        </section>


        <!-- Footer -->
        <footer class="card__footer">

            <p>
                Let's stay connected.
            </p>

        </footer>

    </main>

    <!-- QR view -->
    <section class="qr-view" id="qr-view" hidden>

        <div class="qr-view__content">

            <p class="qr-view__label">
                Scan to connect
            </p>

            <img
                class="qr-view__code"
                src="assets/images/contact-qr.svg"
                alt="QR code to open my digital business card"
            >

            <p class="qr-view__name">
                Martin Bello
            </p>

            <p class="qr-view__title">
                Marine Biologist & Data Analist
            </p>

            <button
                class="button button--secondary qr-view__back"
                id="hide-qr"
                type="button"
            >
                Back to card
            </button>

        </div>

    </section>


    <!-- JavaScript -->
    <script src="js/app.js"></script>

</body>
</html>
